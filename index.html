<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monster Clicker v0.2.0</title>
<style>
body{margin:0;background:#222;color:#fff;font:20px Arial;display:flex;justify-content:center;align-items:center;height:100vh}
#g{text-align:center}
#m{width:160px;height:160px;border-radius:50%;margin:20px auto;cursor:pointer}
button{padding:8px 14px;font-size:16px;margin-top:10px}
</style>
</head>
<body>
<div id=g>
<div>💰 <span id=c>0</span></div>
<div id=m></div>
<div id=n></div>
<div>❤️ <span id=h></span></div>
<div>⚔️ Damage: <span id=d>1.0</span></div>
<button id=b>Upgrade Sword (30💰)</button>
<div id=t></div>
</div>

<script>
let M=[
["Zombie","lime",10,3,5,0],
["Skeleton","gray",25,7,16,30],
["Warden","#001f5b",70,23,36,0]
],hp,max,coins=0,dmg=1,cost=30,dead=0,cur;

function sp(){
dead=0;
let r=Math.random()*100;
cur=r<7?M[2]:r<47?M[1]:M[0];
m.style.display="block";
m.style.background=cur[1];
hp=max=cur[2];
n.textContent=cur[0];
h.textContent=hp+"/"+max;
t.textContent="";
}

sp();

b.onclick=()=>{
if(coins<cost)return;
coins-=cost;
dmg=+(dmg+0.2).toFixed(1);
cost+=15;
c.textContent=coins;
d.textContent=dmg.toFixed(1);
b.textContent="Upgrade Sword ("+cost+"💰)";
};

m.onclick=()=>{
if(dead)return;

if(cur[0]=="Skeleton"&&Math.random()<0.3){
t.textContent="❌ Промах!";
return;
}

hp-=dmg;

if(cur[0]=="Warden"&&Math.random()<0.1){
coins++;
c.textContent=coins;
t.textContent="🍀 +1 монета";
}

if(hp<0)hp=0;
h.textContent=hp+"/"+max;

if(hp<=0){
dead=1;
m.style.display="none";

let r=Math.floor(Math.random()*(cur[4]-cur[3]+1))+cur[3];
coins+=r;
c.textContent=coins;

let s=4;
t.innerHTML="💰 +"+r+"<br>⏳ "+s;

let i=setInterval(()=>{
s--;
if(s)t.innerHTML="💰 +"+r+"<br>⏳ "+s;
else{
clearInterval(i);
sp();
}
},1000);
}
};
</script>
</body>
  </html>
